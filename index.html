<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="left">
            <h2>Create an Account</h2>
            <div class="leftelement">

                <button class="social social1">
                    <span class="social-icon" aria-hidden="true"><i class="bi bi-facebook"></i></span>
                    <span>Sign in with Facebook</span>
                </button>

                <button class="social social2" type="button">
                    <span class="social-icon" aria-hidden="true"><i class="bi bi-twitter"></i></span>
                    <span>Sign in with Twitter</span>
                </button>


                <button class="social social3" type="button">
                    <span class="social-icon" aria-hidden="true"><i class="bi bi-google"></i></span>
                    <span>Sign in with Google</span>
                </button>


                <button class="social social4" type="button">
                    <span class="social-icon" aria-hidden="true"><i class="bi bi-behance"></i></span>
                    <span>Sign in with Behance</span>
                </button>


            </div>
        </div>
        <div class="right">
            <div class="rightelement">
                <h3>Modern Website Form</h3>
                <form>
                    <div class="field">
                        <input type="text" name="username" id="username" placeholder="username">
                        <i class="bi bi-person-fill" aria-hidden="true"></i>
                    </div>

                    <div class="field">
                        <input type="email" name="email" id="email" placeholder="email">
                        <i class="bi bi-envelope-fill" aria-hidden="true"></i>
                    </div>




                    <div class="field">
                        <input type="password" name="password" id="password" placeholder="password"
                            aria-label="Password">
                        <i class="bi bi-lock-fill" aria-hidden="true"></i>
                    </div>


                    <input type="submit" class="submit" value="SIGN UP">
                </form>
            </div>
        </div>

    </div>
</body>

</html>
